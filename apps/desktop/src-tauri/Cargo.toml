[package]
name = "terrarium-desktop"
version = "0.1.0"
description = "Terrarium companion that lives above the taskbar"
edition = "2021"
publish = false

[lib]
name = "terrarium_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde_json = "1"
ureq = "2"
url = "2"
